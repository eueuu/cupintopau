<!-- DÚVIDAS E RESPOSTAS SOBRE O CÓDIGO HTML

P: Por que usamos class="musica-card"?
R: Para poder estilizar esse elemento específico no CSS usando .musica-card

P: Por que tem link para style.css no head?
R: Para conectar o arquivo CSS que contém os estilos da página

-->

<!DOCTYPE html> <!-- Indica que é HTML5 -->
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Para aceitar acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Para responsividade -->
    <title>Música</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="musica-card">
        <img src="capa-album.jpg" alt="Capa do Álbum">
        <h3>Nome da Música</h3>
        <p>Artista</p>
    </div>
</body>
</html>
